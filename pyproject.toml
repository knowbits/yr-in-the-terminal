[project]
name = "yr-in-the-terminal"
version = "0.1.0"
description = "Terminal weather forecasts from yr.no (MET Norway), rendered with Rich."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
yr = "yr_in_the_terminal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yr_in_the_terminal"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
